name: CASIO Structural Regime Router Research

on:
  push:
    branches: [main]
    paths:
      - 'casio/structural_regime_router_research.py'
      - 'casio/structural_frequency_research.py'
      - 'casio/structural_portfolio_latest.py'
      - 'data/xauusd_m5_secondary_octafx_mt4.csv'
      - '.github/workflows/structural-regime-router-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: casio-structural-regime-router-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Slice secondary feed with warmup
        shell: bash
        run: |
          mkdir -p tmp
          test -f data/xauusd_m5_secondary_octafx_mt4.csv
          awk -F, 'NR==1 || $1 >= "2023-10-01T00:00:00Z"' \
            data/xauusd_m5_secondary_octafx_mt4.csv \
            > tmp/xauusd_m5_secondary_2023warmup.csv

      - name: Run causal playbook router research
        run: |
          python -m casio.structural_regime_router_research \
            --data tmp/xauusd_m5_secondary_2023warmup.csv \
            --output reports/structural-regime-router

      - name: Publish report
        run: cat reports/structural-regime-router/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: casio-structural-regime-router
          path: reports/structural-regime-router/
          retention-days: 60
