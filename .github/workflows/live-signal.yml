name: CASIO RR10 Regime Router Email

on:
  push:
    branches: [main]
    paths:
      - 'casio/live_signal.py'
      - 'casio/regime_router_engine.py'
      - 'casio/sync_market_data.py'
      - 'scripts/fetch_dukascopy.mjs'
      - '.github/workflows/live-signal.yml'
  workflow_dispatch:
  schedule:
    # RR10 evaluates confirmed M15 closes. Run two minutes after each nominal
    # quarter-hour close so the source feed has time to publish the completed bar.
    - cron: '2,17,32,47 * * * *'

permissions:
  contents: write

concurrency:
  group: casio-rr10-live-signal
  cancel-in-progress: true

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CASIO_GAS_WEBHOOK_URL: ${{ secrets.CASIO_GAS_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install --no-save dukascopy-node@1.50.0

      - name: Determine live fetch window
        id: window
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import pandas as pd

          path = Path('data/xauusd_m5.csv')
          now = pd.Timestamp.now(tz='UTC')
          latest = None
          if path.exists() and path.stat().st_size > 0:
              ts = pd.read_csv(path, usecols=['timestamp'])['timestamp']
              latest = pd.to_datetime(ts, utc=True, errors='coerce').dropna().max()

          # The persistent historical file is being progressively backfilled from
          # 2020. Never let a stale checkpoint make the live job download years of
          # data or join a multi-year gap. Until the backfill reaches current data,
          # live signals use an independent rolling current window.
          repo_is_current = pd.notna(latest) and latest >= now - pd.Timedelta(days=7)
          if repo_is_current:
              start = latest - pd.Timedelta(days=5)
          else:
              start = now - pd.Timedelta(days=14)

          print(f'start={start.isoformat()}')
          print(f'use_repo_data={str(bool(repo_is_current)).lower()}')
          print(f'repo_latest={latest.isoformat() if pd.notna(latest) else ""}')
          PY

      - name: Fetch latest Dukascopy M5 bars
        run: |
          node scripts/fetch_dukascopy.mjs \
            --from '${{ steps.window.outputs.start }}' \
            --output tmp/latest_xauusd_m5.csv \
            --price-type bid \
            --batch-size 1 \
            --batch-pause-ms 1500

      - name: Build current live dataset
        shell: bash
        run: |
          if [ '${{ steps.window.outputs.use_repo_data }}' = 'true' ] && [ -f data/xauusd_m5.csv ]; then
            cp data/xauusd_m5.csv tmp/live_xauusd_m5.csv
            python -m casio.sync_market_data \
              --file tmp/latest_xauusd_m5.csv \
              --output tmp/live_xauusd_m5.csv
          else
            # Backfill is not current yet: use only the recent rolling window so
            # indicator warm-up is contiguous and independent from old checkpoints.
            python -m casio.sync_market_data \
              --file tmp/latest_xauusd_m5.csv \
              --output tmp/live_xauusd_m5.csv
          fi

      - name: Build cross-device RR10 state
        run: |
          python -m casio.rr10_dashboard_state \
            --data tmp/live_xauusd_m5.csv \
            --output tmp/rr10-state.json

      - name: Publish shared RR10 state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = "rr10-live-state"
          path = "rr10-state.json"
          api = f"https://api.github.com/repos/{repo}/contents/{path}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "casio-rr10-state-publisher",
          }

          req = urllib.request.Request(api + "?ref=" + branch, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as response:
              current = json.load(response)

          content = base64.b64encode(Path("tmp/rr10-state.json").read_bytes()).decode("ascii")
          body = json.dumps({
              "message": "state: update RR10 cross-device snapshot",
              "content": content,
              "sha": current["sha"],
              "branch": branch,
          }).encode("utf-8")
          put = urllib.request.Request(api, data=body, headers={**headers, "Content-Type": "application/json"}, method="PUT")
          with urllib.request.urlopen(put, timeout=30) as response:
              result = json.load(response)
          print("Published RR10 state commit:", result["commit"]["sha"])
          PY

      - name: Evaluate latest canonical RR10 M15 entry
        run: |
          python -m casio.live_signal \
            --data tmp/live_xauusd_m5.csv \
            --output tmp/casio_live_signal.json \
            --max-age-minutes 12

      - name: Send email through Google Apps Script
        shell: bash
        run: |
          if [ ! -f tmp/casio_live_signal.json ]; then
            echo '## CASIO RR10 canonical regime-router signal' >> "$GITHUB_STEP_SUMMARY"
            echo 'No fresh RR10 LONG/SHORT setup. No email sent.' >> "$GITHUB_STEP_SUMMARY"
            echo "Persistent data current: ${{ steps.window.outputs.use_repo_data }}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo '## CASIO RR10 canonical regime-router signal' >> "$GITHUB_STEP_SUMMARY"
          cat tmp/casio_live_signal.json >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$CASIO_GAS_WEBHOOK_URL" ]; then
            echo 'Signal found, but CASIO_GAS_WEBHOOK_URL secret is not configured. Email skipped.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          RESPONSE=$(curl -sS -L --retry 3 --retry-delay 2 \
            -H 'Content-Type: application/json' \
            --data-binary @tmp/casio_live_signal.json \
            "$CASIO_GAS_WEBHOOK_URL")
          echo "Apps Script response: $RESPONSE" >> "$GITHUB_STEP_SUMMARY"
