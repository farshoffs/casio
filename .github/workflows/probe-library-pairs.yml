name: Probe Library Pair Sources

on:
  push:
    branches:
      - research/finotive-prop
    paths:
      - '.github/workflows/probe-library-pairs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe GBPUSD share
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://chatgpt.com/library/share/libfile_6388ad59fc108191b342c1d60b0f5274?account_id=personal'
          curl -L --fail --retry 2 -r 0-4095 "$URL" -o /tmp/gbpusd_probe || true
          ls -lh /tmp/gbpusd_probe || true
          file /tmp/gbpusd_probe || true
          head -c 500 /tmp/gbpusd_probe || true
      - name: Probe GBPJPY share
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://chatgpt.com/library/share/libfile_b13e0b318f70819194d4821a7b0c58ea?account_id=personal'
          curl -L --fail --retry 2 -r 0-4095 "$URL" -o /tmp/gbpjpy_probe || true
          ls -lh /tmp/gbpjpy_probe || true
          file /tmp/gbpjpy_probe || true
          head -c 500 /tmp/gbpjpy_probe || true
