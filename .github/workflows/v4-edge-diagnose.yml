name: CASIO v4 Edge Diagnose

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v4-confluence-signals
    paths:
      - 'casio/v4_edge_diagnose.py'
      - '.github/workflows/v4-edge-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m casio.v4_edge_diagnose --data data/xauusd_m5_dukascopy_research.csv
