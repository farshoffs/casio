name: CASIO Strategy Backtest & Audit

on:
  push:
    branches: [main]
    paths:
      - 'casio/**'
      - 'data/**'
      - 'requirements.txt'
      - '.github/workflows/strategy-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  backtest-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check market data
        id: data
        shell: bash
        run: |
          if [ -f data/xauusd.csv ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "## CASIO audit skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "No data/xauusd.csv is present yet. Add/update OHLC data to activate the rolling backtest." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run rolling backtest and audit
        if: steps.data.outputs.available == 'true'
        run: python -m casio.cli --data data/xauusd.csv --output reports

      - name: Publish summary
        if: steps.data.outputs.available == 'true'
        shell: bash
        run: |
          echo "## CASIO XAUUSD Strategy Audit" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat reports/backtest-100.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### Audit" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat reports/audit.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: steps.data.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: casio-strategy-reports
          path: reports/
          retention-days: 30
