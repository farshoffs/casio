name: CASIO Legacy Python Backtest & Audit

on:
  push:
    branches: [main]
    paths:
      - 'casio/config.py'
      - 'casio/strategy.py'
      - 'casio/backtest.py'
      - 'casio/audit.py'
      - 'casio/cli.py'
      - 'data/xauusd.csv'
      - 'requirements.txt'
      - '.github/workflows/strategy-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  backtest-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check legacy market data
        id: data
        shell: bash
        run: |
          if [ -f data/xauusd.csv ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "## CASIO legacy audit skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "No data/xauusd.csv is present. This workflow is retained for the original single-timeframe Python engine." >> "$GITHUB_STEP_SUMMARY"
            echo "For current CASIO v3 MTF research, use the CASIO v3 Research & Robustness workflow with data/xauusd_m5.csv." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run legacy rolling backtest and audit
        if: steps.data.outputs.available == 'true'
        run: python -m casio.cli --data data/xauusd.csv --output reports

      - name: Publish legacy summary
        if: steps.data.outputs.available == 'true'
        shell: bash
        run: |
          echo "## CASIO Legacy XAUUSD Strategy Audit" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat reports/backtest-100.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### Audit" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat reports/audit.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload legacy reports
        if: steps.data.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: casio-legacy-strategy-reports
          path: reports/
          retention-days: 30
