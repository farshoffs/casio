name: CASIO v4 Confluence Research

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v4-confluence-signals
    paths:
      - 'casio/v4_confluence_research.py'
      - 'pine/CASIO_XAUUSD_v4_CONFLUENCE.pine'
      - '.github/workflows/v4-confluence-research.yml'
      - 'data/xauusd_m5_dukascopy_research.csv'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4-confluence-signals

      # One-time source repair is committed back to the feature branch, then future runs are clean.
      - name: Repair NumPy/Pandas clip compatibility
        run: |
          sed -i 's/).clip(upper=100)/)/g' casio/v4_confluence_research.py
          if ! git diff --quiet -- casio/v4_confluence_research.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add casio/v4_confluence_research.py
            git commit -m 'fix: use portable score clipping in v4 research'
            git push origin HEAD:feature/v4-confluence-signals
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install research dependencies
        run: pip install -r requirements.txt

      - name: Run bounded v4 research
        run: |
          python -m casio.v4_confluence_research \
            --data data/xauusd_m5_dukascopy_research.csv \
            --output reports/v4-confluence

      - name: Show latest findings
        run: cat reports/v4-confluence/LATEST.md

      - name: Upload research output
        uses: actions/upload-artifact@v4
        with:
          name: casio-v4-confluence-research
          path: |
            reports/v4-confluence/LATEST.md
            reports/v4-confluence/latest.json
            reports/v4-confluence/candidate_grid.csv
          retention-days: 14
