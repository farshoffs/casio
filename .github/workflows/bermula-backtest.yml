name: Bermula Baseline Backtest

on:
  push:
    branches:
      - research/youtube-playlist-technique
    paths:
      - "scripts/backtest_bermula.py"
      - ".github/workflows/bermula-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Bermula baseline
        run: python scripts/backtest_bermula.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: bermula-baseline-report
          path: reports/bermula-baseline/
          if-no-files-found: error
          retention-days: 14
