name: Historical First Deep Limit Search

on:
  push:
    branches:
      - research/historical-2017-2020
    paths:
      - 'casio/historical_first_deep_limit.py'
      - '.github/workflows/historical-first-deep-limit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run deep limit search
        run: |
          python -m casio.historical_first_deep_limit \
            --data data/xauusd_m5_secondary_octafx_mt4.csv \
            --output reports/historical-first-deep-limit
      - name: Publish summary
        run: cat reports/historical-first-deep-limit/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: historical-first-deep-limit
          path: reports/historical-first-deep-limit/
          retention-days: 30
