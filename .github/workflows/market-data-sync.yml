name: CASIO Dukascopy XAUUSD M5 Sync

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_dukascopy.mjs'
      - 'casio/sync_market_data.py'
      - '.github/workflows/market-data-sync.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * *'

permissions:
  contents: write

concurrency:
  group: casio-market-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CASIO_BACKFILL_START: '2020-01-09T00:00:00Z'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install --no-save dukascopy-node@1.50.0

      - name: Determine fetch window
        id: window
        shell: bash
        run: |
          START=$(python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import os

          path = Path('data/xauusd_m5.csv')
          fallback = pd.Timestamp(os.environ['CASIO_BACKFILL_START'])
          if not path.exists() or path.stat().st_size == 0:
              start = fallback
          else:
              ts = pd.read_csv(path, usecols=['timestamp'])['timestamp']
              latest = pd.to_datetime(ts, utc=True, errors='coerce').dropna().max()
              start = max(fallback, latest - pd.Timedelta(days=3)) if pd.notna(latest) else fallback
          print(start.isoformat())
          PY
          )
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "Fetching XAUUSD M5 from $START"

      - name: Download Dukascopy XAUUSD M5 bid bars
        run: |
          node scripts/fetch_dukascopy.mjs \
            --from '${{ steps.window.outputs.start }}' \
            --output tmp/dukascopy_xauusd_m5.csv \
            --price-type bid

      - name: Merge and validate M5 dataset
        run: |
          python -m casio.sync_market_data \
            --file tmp/dukascopy_xauusd_m5.csv \
            --output data/xauusd_m5.csv

          python - <<'PY'
          import pandas as pd
          df = pd.read_csv('data/xauusd_m5.csv')
          ts = pd.to_datetime(df['timestamp'], utc=True, errors='raise')
          if len(df) < 1000:
              raise SystemExit('Refusing to commit an implausibly small XAUUSD M5 dataset')
          if not ts.is_monotonic_increasing or ts.duplicated().any():
              raise SystemExit('XAUUSD M5 timestamps are not clean/ordered')
          print(f'CASIO dataset ready: {len(df):,} bars, {ts.iloc[0]} -> {ts.iloc[-1]}')
          PY

      - name: Commit new bars
        shell: bash
        run: |
          git add data/xauusd_m5.csv
          if git diff --cached --quiet; then
            echo '## CASIO Dukascopy M5 sync' >> "$GITHUB_STEP_SUMMARY"
            echo 'No new M5 bars to commit.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ROWS=$(($(wc -l < data/xauusd_m5.csv) - 1))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Sync XAUUSD M5 Dukascopy data"
          git pull --rebase origin main
          git push origin HEAD:main

          echo '## CASIO Dukascopy M5 sync' >> "$GITHUB_STEP_SUMMARY"
          echo "Updated data/xauusd_m5.csv to ${ROWS} bars." >> "$GITHUB_STEP_SUMMARY"
