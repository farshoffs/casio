name: CASIO Dukascopy XAUUSD M5 Sync

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_dukascopy.mjs'
      - 'casio/sync_market_data.py'
      - '.github/workflows/market-data-sync.yml'
  workflow_dispatch:
  schedule:
    # Normal once-daily current-data sync.
    - cron: '20 21 * * *'
    # Temporary accelerators while the historical dataset is still behind.
    # They automatically become no-ops after the dataset catches up.
    - cron: '20 1,5,9,13,17 * * *'

permissions:
  contents: write

concurrency:
  group: casio-market-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CASIO_BACKFILL_START: '2020-01-09T00:00:00Z'
      CASIO_BACKFILL_SLICE_DAYS: '90'
      CASIO_CURRENT_TOLERANCE_DAYS: '7'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install --no-save dukascopy-node@1.50.0

      - name: Determine progressive fetch window
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import os
          import pandas as pd

          path = Path('data/xauusd_m5.csv')
          fallback = pd.Timestamp(os.environ['CASIO_BACKFILL_START'])
          slice_days = int(os.environ['CASIO_BACKFILL_SLICE_DAYS'])
          tolerance = pd.Timedelta(days=int(os.environ['CASIO_CURRENT_TOLERANCE_DAYS']))
          now = pd.Timestamp.now(tz='UTC').floor('5min') - pd.Timedelta(minutes=5)
          event_name = os.environ.get('EVENT_NAME', '')
          event_schedule = os.environ.get('EVENT_SCHEDULE', '')
          daily_schedule = '20 21 * * *'

          first = latest = None
          if path.exists() and path.stat().st_size > 0:
              ts = pd.read_csv(path, usecols=['timestamp'])['timestamp']
              parsed = pd.to_datetime(ts, utc=True, errors='coerce').dropna()
              if not parsed.empty:
                  first, latest = parsed.min(), parsed.max()

          caught_up = latest is not None and latest >= now - tolerance

          # The five accelerator cron runs exist only to build history quickly.
          # Once current, they intentionally do nothing; the 21:20 UTC run keeps
          # the finished dataset updated once per day. Push/manual runs are allowed.
          accelerator = event_name == 'schedule' and event_schedule != daily_schedule
          if caught_up and accelerator:
              print('skip=true')
              print('mode=current_noop')
              print(f'first={first.isoformat() if first is not None else ""}')
              print(f'latest={latest.isoformat() if latest is not None else ""}')
              raise SystemExit

          if latest is None:
              start = fallback
              end = min(fallback + pd.Timedelta(days=slice_days), now)
              mode = 'backfill_start'
          elif not caught_up:
              # Keep a one-day overlap around the checkpoint. The merger removes
              # duplicates, so a failed run never loses already committed history.
              start = max(fallback, latest - pd.Timedelta(days=1))
              end = min(latest + pd.Timedelta(days=slice_days), now)
              mode = 'backfill_continue'
          else:
              start = max(fallback, latest - pd.Timedelta(days=3))
              end = now
              mode = 'current_incremental'

          if end <= start:
              print('skip=true')
              print('mode=nothing_to_fetch')
              raise SystemExit

          print('skip=false')
          print(f'mode={mode}')
          print(f'start={start.isoformat()}')
          print(f'end={end.isoformat()}')
          print(f'first={first.isoformat() if first is not None else ""}')
          print(f'latest={latest.isoformat() if latest is not None else ""}')
          PY

          echo "Mode: ${{ steps.window.outputs.mode }}"
          echo "Window: ${{ steps.window.outputs.start }} -> ${{ steps.window.outputs.end }}"

      - name: Skip accelerator when dataset is current
        if: steps.window.outputs.skip == 'true'
        run: |
          echo '## CASIO Dukascopy M5 sync' >> "$GITHUB_STEP_SUMMARY"
          echo 'Historical dataset is already current; this accelerator run is a no-op.' >> "$GITHUB_STEP_SUMMARY"

      - name: Download Dukascopy XAUUSD M5 bid bars
        if: steps.window.outputs.skip != 'true'
        run: |
          node scripts/fetch_dukascopy.mjs \
            --from '${{ steps.window.outputs.start }}' \
            --to '${{ steps.window.outputs.end }}' \
            --output tmp/dukascopy_xauusd_m5.csv \
            --price-type bid

      - name: Merge and validate M5 dataset
        if: steps.window.outputs.skip != 'true'
        run: |
          python -m casio.sync_market_data \
            --file tmp/dukascopy_xauusd_m5.csv \
            --output data/xauusd_m5.csv

          python - <<'PY'
          import pandas as pd

          df = pd.read_csv('data/xauusd_m5.csv')
          ts = pd.to_datetime(df['timestamp'], utc=True, errors='raise')
          if len(df) < 1000:
              raise SystemExit('Refusing to commit an implausibly small XAUUSD M5 dataset')
          if not ts.is_monotonic_increasing or ts.duplicated().any():
              raise SystemExit('XAUUSD M5 timestamps are not clean/ordered')
          if (df[['open','high','low','close']].isna().any().any()):
              raise SystemExit('XAUUSD M5 contains missing OHLC values')
          if ((df['high'] < df[['open','close','low']].max(axis=1)) | (df['low'] > df[['open','close','high']].min(axis=1))).any():
              raise SystemExit('XAUUSD M5 contains invalid OHLC relationships')
          span_days = (ts.iloc[-1] - ts.iloc[0]).total_seconds() / 86400
          print(f'CASIO dataset checkpoint: {len(df):,} bars, {ts.iloc[0]} -> {ts.iloc[-1]} ({span_days:.1f} days)')
          PY

      - name: Commit checkpoint
        if: steps.window.outputs.skip != 'true'
        shell: bash
        run: |
          git add data/xauusd_m5.csv
          if git diff --cached --quiet; then
            echo '## CASIO Dukascopy M5 sync' >> "$GITHUB_STEP_SUMMARY"
            echo 'No new M5 bars to commit.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ROWS=$(($(wc -l < data/xauusd_m5.csv) - 1))
          FIRST=$(tail -n +2 data/xauusd_m5.csv | head -n 1 | cut -d, -f1)
          LAST=$(tail -n 1 data/xauusd_m5.csv | cut -d, -f1)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Checkpoint XAUUSD M5 Dukascopy data"
          git pull --rebase origin main
          git push origin HEAD:main

          echo '## CASIO Dukascopy M5 sync' >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: ${{ steps.window.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Rows: ${ROWS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage: ${FIRST} -> ${LAST}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Backfill is progressive: each successful slice is committed, so later provider throttling cannot erase earlier progress.' >> "$GITHUB_STEP_SUMMARY"
