name: CASIO Regime Router — Repair Research

on:
  push:
    branches: [feature/regime-router-dashboard-research]
    paths:
      - 'casio/regime_router_repairs.py'
      - '.github/workflows/regime-router-repairs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/regime-router-dashboard-research
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install tabulate
      - name: Run repair research
        run: python -m casio.regime_router_repairs
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/regime-router-repair-research
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "research: test Regime Router repair hypotheses"
            git push origin HEAD:feature/regime-router-dashboard-research
          fi
