name: BBMA Cross-Feed Grid

on:
  push:
    branches:
      - feature/v4-confluence-signals
    paths:
      - 'casio/bbma_crossfeed_grid.py'
      - '.github/workflows/bbma-crossfeed-grid.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4-confluence-signals
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install pandas numpy numba
      - name: Run cross-feed grid
        run: python -m casio.bbma_crossfeed_grid
      - name: Show report
        run: cat reports/bbma-crossfeed-grid/REPORT.md
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: bbma-crossfeed-grid
          path: reports/bbma-crossfeed-grid/
          retention-days: 14
