name: BBMA Cross-Feed Diagnostics

on:
  push:
    branches:
      - feature/v4-confluence-signals
    paths:
      - 'casio/bbma_crossfeed_diagnostics.py'
      - '.github/workflows/bbma-crossfeed-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4-confluence-signals
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install pandas numpy numba
      - name: Run diagnostics
        run: python -m casio.bbma_crossfeed_diagnostics
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bbma-crossfeed-diagnostics
          path: reports/bbma-crossfeed-diagnostics/
          retention-days: 14
