name: CASIO Secondary Feed Structural Research
# Latest-first secondary robustness research. The full secondary CSV stays intact;
# the workflow slices a 2023-10 warmup so the requested 2024-2026 study runs fast.

on:
  push:
    branches: [main]
    paths:
      - 'data/xauusd_m5_secondary_octafx_mt4.csv'
      - 'casio/secondary_feed_research.py'
      - 'casio/structural_frequency_research.py'
      - 'casio/structural_portfolio_latest.py'
      - '.github/workflows/secondary-structural-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: casio-secondary-structural-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate secondary data exists
        run: |
          test -f data/xauusd_m5_secondary_octafx_mt4.csv
          python - <<'PY'
          from pathlib import Path
          p = Path('data/xauusd_m5_secondary_octafx_mt4.csv')
          print(f'Secondary CSV: {p.stat().st_size/1024/1024:.2f} MiB')
          PY

      - name: Slice 2024-2026 research horizon with structural warmup
        shell: bash
        run: |
          mkdir -p tmp
          awk -F, 'NR==1 || $1 >= "2023-10-01T00:00:00Z"' \
            data/xauusd_m5_secondary_octafx_mt4.csv \
            > tmp/xauusd_m5_secondary_2023warmup.csv
          python - <<'PY'
          import pandas as pd
          p = 'tmp/xauusd_m5_secondary_2023warmup.csv'
          df = pd.read_csv(p, usecols=['timestamp'])
          print(f'Research slice rows: {len(df):,}')
          print('Research slice:', df.timestamp.iloc[0], '->', df.timestamp.iloc[-1])
          PY

      - name: Run latest-first secondary-feed research
        run: |
          python -m casio.secondary_feed_research \
            --data tmp/xauusd_m5_secondary_2023warmup.csv \
            --output reports/structural-secondary

      - name: Publish report
        run: cat reports/structural-secondary/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: casio-structural-secondary
          path: reports/structural-secondary/
          retention-days: 60
