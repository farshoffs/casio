name: Build bundled cTrader WebView dashboard

on:
  push:
    branches:
      - feature/regime-router-dashboard-research
    paths:
      - ctrader-web-plugin/regime-router-dashboard/index.html
      - .github/workflows/build-ctrader-web-plugin.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned browser dependencies
        run: |
          npm install --no-save             esbuild@0.25.9             @spotware-web-team/sdk@0.0.20             @spotware-web-team/sdk-external-api@0.0.6             rxjs@7.8.2             @veksa/logger@1.0.14

      - name: Extract and retarget module imports
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          src = Path("ctrader-web-plugin/regime-router-dashboard/index.html")
          html = src.read_text(encoding="utf-8")
          m = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          if not m:
              raise SystemExit("module script not found")

          js = m.group(1)
          replacements = {
              'https://esm.sh/@spotware-web-team/sdk-external-api@0.0.6': '@spotware-web-team/sdk-external-api',
              'https://esm.sh/@spotware-web-team/sdk@0.0.9': '@spotware-web-team/sdk',
              'https://esm.sh/rxjs@7.8.2': 'rxjs',
              'https://esm.sh/@veksa/logger@1.0.6': '@veksa/logger',
          }
          for old, new in replacements.items():
              if old not in js:
                  raise SystemExit(f"expected import missing: {old}")
              js = js.replace(old, new)

          build_dir = Path("ctrader-web-plugin/regime-router-dashboard/.build")
          build_dir.mkdir(parents=True, exist_ok=True)
          (build_dir / "casio-app.mjs").write_text(js, encoding="utf-8")
          dist = Path("ctrader-web-plugin/regime-router-dashboard/dist")
          dist.mkdir(parents=True, exist_ok=True)
          import os
          build_id = os.environ.get("GITHUB_SHA", "dev")[:12]
          html = html.replace("__BUILD_ID__", build_id)
          html_dist = html[:m.start()] + '<script src="./bundle-RR5A.js"></script>' + html[m.end():]
          (dist / "index.html").write_text(html_dist, encoding="utf-8")
          PY

      - name: Bundle SDK into same-origin JavaScript
        id: bundle
        continue-on-error: true
        run: |
          set +e
          npx esbuild ctrader-web-plugin/regime-router-dashboard/.build/casio-app.mjs             --bundle             --format=iife             --platform=browser             --target=es2020             --minify             --outfile=ctrader-web-plugin/regime-router-dashboard/dist/bundle-RR5A.js             > /tmp/esbuild.log 2>&1
          CODE=$?
          cat /tmp/esbuild.log
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record bundler failure
        if: steps.bundle.outputs.exit_code != '0'
        run: |
          cp /tmp/esbuild.log ctrader-web-plugin/regime-router-dashboard/BUILD_ERROR.txt
          rm -rf ctrader-web-plugin/regime-router-dashboard/.build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ctrader-web-plugin/regime-router-dashboard/BUILD_ERROR.txt
          git commit -m "Record cTrader WebView bundle error"
          git push

      - name: Stop on bundler failure
        if: steps.bundle.outputs.exit_code != '0'
        run: exit 1

      - name: Guard bundled output
        if: steps.bundle.outputs.exit_code == '0'
        run: |
          python - <<'PY'
          from pathlib import Path
          dist = Path("ctrader-web-plugin/regime-router-dashboard/dist")
          html = (dist / "index.html").read_text(encoding="utf-8")
          js = (dist / "bundle-RR5A.js").read_text(encoding="utf-8")
          if "esm.sh" in html or "esm.sh" in js:
              raise SystemExit("external esm.sh dependency remains in bundle")
          if "bundle-RR5A.js" not in html:
              raise SystemExit("bundle-RR5A.js is not referenced by dist/index.html")
          if len(js) < 10000:
              raise SystemExit("bundle unexpectedly small")
          print(f"Bundled dashboard: {len(js):,} bytes")
          PY

      - name: Commit bundled output
        if: steps.bundle.outputs.exit_code == '0'
        run: |
          rm -f ctrader-web-plugin/regime-router-dashboard/BUILD_ERROR.txt
          rm -rf ctrader-web-plugin/regime-router-dashboard/.build
          if git diff --quiet -- ctrader-web-plugin/regime-router-dashboard; then
            echo "Bundled output unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ctrader-web-plugin/regime-router-dashboard
          git commit -m "Bundle cTrader WebView SDK for same-origin loading"
          git push
