name: RR10 M5 Confirmation Research

on:
  workflow_dispatch:
  push:
    branches:
      - feature/regime-router-dashboard-research
    paths:
      - 'casio/rr10_m5_confirmation_research.py'
      - '.github/workflows/rr10-m5-confirmation-research.yml'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/regime-router-dashboard-research
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Run conditional M5 research
        run: python casio/rr10_m5_confirmation_research.py
      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/regime-router-canonical/m5-confirmation-research/
          if git diff --cached --quiet; then
            echo "No research output changes"
          else
            git commit -m "research: record RR10 conditional M5 confirmation results"
            git push origin HEAD:feature/regime-router-dashboard-research
          fi
