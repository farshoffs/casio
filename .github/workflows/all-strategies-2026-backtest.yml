name: CASIO All Strategies 2026 Dukascopy Backtest

on:
  push:
    branches:
      - feature/v4-confluence-signals
    paths:
      - casio/all_strategies_2026_backtest.py
      - .github/workflows/all-strategies-2026-backtest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: feature/v4-confluence-signals
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backtest all CASIO strategies on 2026 Dukascopy
        run: python -m casio.all_strategies_2026_backtest

      - name: Commit consolidated report and audit CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/all-strategies-2026
          if git diff --cached --quiet; then
            echo "No report changes to commit"
            exit 0
          fi
          git commit -m "research: all strategies 2026 Dukascopy RM100 report"
          git pull --rebase origin feature/v4-confluence-signals
          git push origin HEAD:feature/v4-confluence-signals
