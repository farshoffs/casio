name: CASIO v6 New Strategy — Session Range

on:
  push:
    branches:
      - feature/v6-session-trap
    paths:
      - casio/v6_session_range_reaction.py
      - .github/workflows/v6-session-range-2026.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout v6 branch
        uses: actions/checkout@v4
        with:
          ref: feature/v6-session-trap
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install tabulate

      - name: Run brand-new v6 find and untouched 2026 test
        run: python -m casio.v6_session_range_reaction

      - name: Commit report and audit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/v6-session-range-2026
          if git diff --cached --quiet; then
            echo "No report changes to commit"
            exit 0
          fi
          git commit -m "research: v6 new strategy 2026 equity-first report"
          git pull --rebase origin feature/v6-session-trap
          git push origin HEAD:feature/v6-session-trap

# Separate branch/run so prior CASIO strategy research cannot influence this test.
