name: Deploy CASIO cTrader dashboard to GitHub Pages

on:
  push:
    branches:
      - feature/regime-router-dashboard-research
    paths:
      - ctrader-web-plugin/regime-router-dashboard/dist/**
      - .github/workflows/deploy-ctrader-dashboard-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ctrader-dashboard-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: ctrader-web-plugin/regime-router-dashboard/dist

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
