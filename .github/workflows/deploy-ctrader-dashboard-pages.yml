name: Deploy CASIO RR10 cross-device plugin

on:
  push:
    branches:
      - main
    paths:
      - ctrader-web-plugin/regime-router-dashboard/index.html
      - ctrader-web-plugin/cross-device/index.html
      - .github/workflows/deploy-ctrader-dashboard-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ctrader-dashboard-pages-v2
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact cTrader browser SDK
        run: |
          npm install --no-save \
            esbuild@0.25.9 \
            @spotware-web-team/sdk@0.0.20 \
            @spotware-web-team/sdk-external-api@0.0.5 \
            rxjs@7.8.2 \
            @veksa/logger@1.0.6

      - name: Build self-contained RR10 cross-device plugin
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re

          src = Path("ctrader-web-plugin/cross-device/index.html")
          html = src.read_text(encoding="utf-8")
          m = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          if not m:
              raise SystemExit("module script not found")

          js = m.group(1)
          replacements = {
              'https://esm.sh/@spotware-web-team/sdk-external-api@0.0.5': '@spotware-web-team/sdk-external-api',
              'https://esm.sh/@spotware-web-team/sdk@0.0.20': '@spotware-web-team/sdk',
              'https://esm.sh/rxjs@7.8.2': 'rxjs',
              'https://esm.sh/@veksa/logger@1.0.6': '@veksa/logger',
          }
          for old, new in replacements.items():
              if old not in js:
                  raise SystemExit(f"expected import missing: {old}")
              js = js.replace(old, new)

          required = [
              "RR10-XD1",
              "rr10-live-state/rr10-state.json",
              "casio.regime-router.rr10.state.v1",
              "getLightSymbolList",
              "getSymbol",
              "subscribeQuotes",
              "quoteEvent",
          ]
          for token in required:
              if token not in js:
                  raise SystemExit(f"cross-device plugin missing: {token}")
          forbidden = [
              "getTrendbarList", "getServerData", "getTrendbarListCompat",
              "oldRouterSelected0591", "canonicalDir", "fetchM15History", "resampleBars",
              "createNewOrder", "modifyOrder", "closePosition", "cancelOrder",
          ]
          for token in forbidden:
              if token in js:
                  raise SystemExit(f"cross-device plugin must not contain: {token}")

          build = Path(".pages-build")
          public = Path("public")
          build.mkdir(exist_ok=True)
          public.mkdir(exist_ok=True)

          entry = build / "casio-app.mjs"
          entry.write_text(js, encoding="utf-8")

          version = os.environ["BUILD_SHA"][:12]
          rendered = html[:m.start()] + f'<script src="./bundle.js?v={version}"></script>' + html[m.end():]
          (public / "index.html").write_text(rendered, encoding="utf-8")
          PY

          npx esbuild .pages-build/casio-app.mjs \
            --bundle \
            --format=iife \
            --platform=browser \
            --target=es2020 \
            --minify \
            --outfile=public/bundle.js

          mkdir -p public/rr10
          cp public/index.html public/rr10/index.html
          cp public/bundle.js public/rr10/bundle.js

      - name: Guard deployed build
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path("public/index.html").read_text(encoding="utf-8")
          js = Path("public/bundle.js").read_text(encoding="utf-8")
          rr10_html = Path("public/rr10/index.html").read_text(encoding="utf-8")
          rr10_js = Path("public/rr10/bundle.js").read_text(encoding="utf-8")

          checks = {
              "versioned RR10 route": "RR10-XD1" in rr10_html and "RR10-XD1" in rr10_js,
              "RR10 visible": "CASIO Regime Router" in html and "RR10-XD1" in js,
              "cache-busted bundle": "bundle.js?v=" in html,
              "self-contained": "esm.sh" not in html and "esm.sh" not in js,
              "shared state feed": "rr10-live-state/rr10-state.json" in js,
              "state schema": "casio.regime-router.rr10.state.v1" in js,
              "quote overlay": "Quote live" in js,
              "no history RPC": "getTrendbarList" not in js and "getServerData" not in js,
              "one decision state": "One RR10 decision state shared by every device" in html,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Pages build guard failed: " + ", ".join(failed))
          print("RR10 cross-device Pages guard passed")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
