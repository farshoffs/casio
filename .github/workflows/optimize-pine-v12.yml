name: Optimize Pine dashboard v1.2

on:
  push:
    branches:
      - feature/regime-router-dashboard-research
    paths:
      - .github/workflows/optimize-pine-v12.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/regime-router-dashboard-research
          fetch-depth: 0

      - name: Apply semantics-preserving Pine optimizations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tradingview/casio_regime_router_dashboard_v1.pine')
          s = path.read_text()
          original = s

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
              'strategy("CASIO Regime Router — M15/H1/H4 Dashboard v1.1",',
              'strategy("CASIO Regime Router — M15/H1/H4 Dashboard v1.2",',
              'version')

          replace_once(
              '''prevDayHigh = request.security(syminfo.tickerid, "D", high[1], gaps=barmerge.gaps_off, lookahead=barmerge.lookahead_on)\nprevDayLow = request.security(syminfo.tickerid, "D", low[1], gaps=barmerge.gaps_off, lookahead=barmerge.lookahead_on)\n\n// Completed higher-timeframe candles only.\nh1Close = request.security(syminfo.tickerid, "60", close[1], gaps=barmerge.gaps_off, lookahead=barmerge.lookahead_on)\nh1Ema20 = request.security(syminfo.tickerid, "60", ta.ema(close, 20)[1], gaps=barmerge.gaps_off, lookahead=barmerge.lookahead_on)\nh1Ema50 = request.security(syminfo.tickerid, "60", ta.ema(close, 50)[1], gaps=barmerge.gaps_off, lookahead=barmerge.lookahead_on)\nh1Bias = f_bias(h1Close, h1Ema20, h1Ema50)\n\nh4Close = request.security(syminfo.tickerid, "240", close[1], gaps=barmerge.gaps_off, lookahead=barmerge.lookahead_on)\nh4Ema20 = request.security(syminfo.tickerid, "240", ta.ema(close, 20)[1], gaps=barmerge.gaps_off, lookahead=barmerge.lookahead_on)\nh4Ema50 = request.security(syminfo.tickerid, "240", ta.ema(close, 50)[1], gaps=barmerge.gaps_off, lookahead=barmerge.lookahead_on)\nh4Adx = request.security(syminfo.tickerid, "240", f_adx()[1], gaps=barmerge.gaps_off, lookahead=barmerge.lookahead_on)\nh4Bias = f_bias(h4Close, h4Ema20, h4Ema50)''',
              '''// Group same-timeframe values into one request.security() call.\n// Expressions and completed-candle offsets are unchanged from v1.1.\n[prevDayHigh, prevDayLow] = request.security(syminfo.tickerid, "D", [high[1], low[1]], gaps=barmerge.gaps_off, lookahead=barmerge.lookahead_on)\n\n// Completed higher-timeframe candles only.\n[h1Close, h1Ema20, h1Ema50] = request.security(syminfo.tickerid, "60", [close[1], ta.ema(close, 20)[1], ta.ema(close, 50)[1]], gaps=barmerge.gaps_off, lookahead=barmerge.lookahead_on)\nh1Bias = f_bias(h1Close, h1Ema20, h1Ema50)\n\n[h4Close, h4Ema20, h4Ema50, h4Adx] = request.security(syminfo.tickerid, "240", [close[1], ta.ema(close, 20)[1], ta.ema(close, 50)[1], f_adx()[1]], gaps=barmerge.gaps_off, lookahead=barmerge.lookahead_on)\nh4Bias = f_bias(h4Close, h4Ema20, h4Ema50)''',
              'HTF request consolidation')

          function_end = '''f_support_count(_dir) =>\n    c = 0\n    c += _dir == 1 and f_recent(last0591Long) ? 1 : _dir == -1 and f_recent(last0591Short) ? 1 : 0\n    c += _dir == 1 and f_recent(lastV1Long) ? 1 : _dir == -1 and f_recent(lastV1Short) ? 1 : 0\n    c += _dir == 1 and f_recent(lastOutLong) ? 1 : _dir == -1 and f_recent(lastOutShort) ? 1 : 0\n    c += _dir == 1 and f_recent(lastSpLong) ? 1 : _dir == -1 and f_recent(lastSpShort) ? 1 : 0\n    c += _dir == 1 and f_recent(lastSfLong) ? 1 : _dir == -1 and f_recent(lastSfShort) ? 1 : 0\n    c\n'''
          replace_once(
              function_end,
              function_end + '''\n// Compute agreement once per M15 bar and reuse it in router + dashboard.\nsupportLong = f_support_count(1)\nsupportShort = f_support_count(-1)\n''',
              'agreement cache')

          replace_once(
              'else if m0591Dir != 0 and f_support_count(m0591Dir) >= 2',
              'else if m0591Dir != 0 and (m0591Dir == 1 ? supportLong : supportShort) >= 2',
              '0591 support reuse')
          replace_once(
              'else if v1Dir != 0 and f_support_count(v1Dir) >= 2',
              'else if v1Dir != 0 and (v1Dir == 1 ? supportLong : supportShort) >= 2',
              'V1 support reuse')

          replace_once(
              '''    supportLong = f_support_count(1)\n    supportShort = f_support_count(-1)\n    f_cell(0, 9, "AGREEMENT", panel2, muted, size.small)''',
              '''    f_cell(0, 9, "AGREEMENT", panel2, muted, size.small)''',
              'dashboard support reuse')

          if s == original:
              raise SystemExit('No changes were applied')

          must_keep = [
              'trendAdxThreshold = input.float(18.0',
              'riskPct = input.float(5.0',
              'impLong = rangeAtr >= 1.20',
              'impShort = rangeAtr >= 1.20',
              'Trend priority: 0591 -> V1 -> Outcome -> Structural Portfolio -> Structural Freq',
              'Mixed priority: Structural Portfolio -> Outcome -> Structural Freq -> 0591 -> V1',
              'commission_value=0.005',
              'strategy.convert_to_symbol(riskCashAccount)',
          ]
          for token in must_keep:
              if token not in s:
                  raise SystemExit(f'Guardrail failed; missing: {token}')

          if s.count('request.security(') != 3:
              raise SystemExit(f'Expected 3 request.security calls after optimization, got {s.count("request.security(")}')

          path.write_text(s)
          print('Pine v1.2 optimization applied successfully')
          PY

      - name: Commit optimized Pine and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/optimize-pine-v12.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tradingview/casio_regime_router_dashboard_v1.pine .github/workflows/optimize-pine-v12.yml
          git diff --cached --check
          git commit -m "Optimize TradingView dashboard without changing router logic"
          git push origin HEAD:feature/regime-router-dashboard-research
