name: CASIO v4 Tune Pine Defaults

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v4-confluence-signals
    paths:
      - '.github/workflows/v4-tune-pine-defaults.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4-confluence-signals
      - name: Apply validated defaults and playbook gates
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pine/CASIO_XAUUSD_v4_CONFLUENCE.pine')
          s = p.read_text()
          s = s.replace('profile = input.string("QUALITY_70", "Profile"', 'profile = input.string("FREQUENCY", "Profile"')
          s = s.replace('targetR = input.float(1.20, "Take-profit R", minval=0.70', 'targetR = input.float(0.60, "Take-profit R", minval=0.50')
          s = s.replace('cooldownBars = input.int(9, "Cooldown M5 bars"', 'cooldownBars = input.int(6, "Cooldown M5 bars"')
          s = s.replace('beTriggerR = input.float(0.80, "Breakeven trigger R"', 'beTriggerR = input.float(0.35, "Breakeven trigger R"')
          anchor = 'rangeAtrMin = input.float(0.70, "Displacement range / ATR", minval=0.30, maxval=2.00, step=0.05, group=groupModel)\n'
          addition = anchor + 'useLiqFvgEntries = input.bool(false, "Use liquidity/FVG as standalone entry", group=groupModel)\nuseBreakoutEntries = input.bool(false, "Use breakout/retest as standalone entry", group=groupModel)\nuseBbmaEntries = input.bool(true, "Use BBMA re-entry", group=groupModel)\nuseSdEntries = input.bool(true, "Use supply/demand rejection", group=groupModel)\n'
          if 'useLiqFvgEntries = input.bool' not in s:
              s = s.replace(anchor, addition)
          s = s.replace('liqFvgLong = sellSweepAge <= 3 and dispLong and (bullFvg or close > ema20)', 'liqFvgLong = useLiqFvgEntries and sellSweepAge <= 3 and dispLong and (bullFvg or close > ema20)')
          s = s.replace('liqFvgShort = buySweepAge <= 3 and dispShort and (bearFvg or close < ema20)', 'liqFvgShort = useLiqFvgEntries and buySweepAge <= 3 and dispShort and (bearFvg or close < ema20)')
          s = s.replace('breakRetestLong = retestLong and (m15Bias >= 0 or h1Bias == 1)', 'breakRetestLong = useBreakoutEntries and retestLong and (m15Bias >= 0 or h1Bias == 1)')
          s = s.replace('breakRetestShort = retestShort and (m15Bias <= 0 or h1Bias == -1)', 'breakRetestShort = useBreakoutEntries and retestShort and (m15Bias <= 0 or h1Bias == -1)')
          s = s.replace('bbmaReentryLong = bbmaLong and h1Bias >= 0 and m15Bias >= 0', 'bbmaReentryLong = useBbmaEntries and bbmaLong and h1Bias >= 0 and m15Bias >= 0')
          s = s.replace('bbmaReentryShort = bbmaShort and h1Bias <= 0 and m15Bias <= 0', 'bbmaReentryShort = useBbmaEntries and bbmaLong == false and bbmaShort and h1Bias <= 0 and m15Bias <= 0')
          s = s.replace('sdBounceLong = demandReject and (sellSweepAge <= 5 or bbLongAge <= 4) and h1Bias >= 0', 'sdBounceLong = useSdEntries and demandReject and (sellSweepAge <= 5 or bbLongAge <= 4) and h1Bias >= 0')
          s = s.replace('sdBounceShort = supplyReject and (buySweepAge <= 5 or bbShortAge <= 4) and h1Bias <= 0', 'sdBounceShort = useSdEntries and supplyReject and (buySweepAge <= 5 or bbShortAge <= 4) and h1Bias <= 0')
          p.write_text(s)
          PY
          # Remove an accidental long-side guard if this workflow is rerun from an intermediate edit.
          sed -i 's/useBbmaEntries and bbmaLong == false and bbmaShort/useBbmaEntries and bbmaShort/' pine/CASIO_XAUUSD_v4_CONFLUENCE.pine
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- pine/CASIO_XAUUSD_v4_CONFLUENCE.pine; then
            git add pine/CASIO_XAUUSD_v4_CONFLUENCE.pine
            git commit -m 'feat: promote validated v4 core signal defaults'
            git push origin HEAD:feature/v4-confluence-signals
          fi
