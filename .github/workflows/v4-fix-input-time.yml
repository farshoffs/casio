name: CASIO v4 Fix Pine input.time

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v4-confluence-signals
    paths:
      - '.github/workflows/v4-fix-input-time.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4-confluence-signals
      - name: Replace non-const input.time defaults
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pine/CASIO_XAUUSD_v4_CONFLUENCE.pine')
          s = p.read_text()
          s = s.replace('backtestStart = input.time(timestamp("GMT+0", 2024, 1, 1, 0, 0), "Backtest start", group=groupBacktest)', 'backtestStart = input.time(1704067200000, "Backtest start", group=groupBacktest)')
          s = s.replace('backtestEnd = input.time(timestamp("GMT+0", 2030, 12, 31, 23, 59), "Backtest end", group=groupBacktest)', 'backtestEnd = input.time(1924991940000, "Backtest end", group=groupBacktest)')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pine/CASIO_XAUUSD_v4_CONFLUENCE.pine
          if ! git diff --cached --quiet; then
            git commit -m 'fix: use const timestamps for Pine backtest inputs'
            git push origin HEAD:feature/v4-confluence-signals
          fi
