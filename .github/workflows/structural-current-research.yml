name: CASIO Structural Portfolio — Current Market

on:
  push:
    branches: [main]
    paths:
      - 'casio/structural_portfolio_latest.py'
      - 'casio/structural_current_research.py'
      - 'casio/v3_structural_aplus.py'
      - 'casio/v3_core.py'
      - 'casio/v3_m5_engine.py'
      - 'scripts/fetch_dukascopy.mjs'
      - '.github/workflows/structural-current-research.yml'
  workflow_dispatch:
  schedule:
    - cron: '5 22 * * *'

permissions:
  contents: read

concurrency:
  group: casio-structural-current-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install --no-save dukascopy-node@1.50.0

      - name: Choose current research source
        id: source
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import pandas as pd

          now = pd.Timestamp.now(tz='UTC').floor('5min')
          start = now - pd.Timedelta(days=210)
          path = Path('data/xauusd_m5_dukascopy_research.csv')
          use_cache = False
          first = latest = None

          if path.exists() and path.stat().st_size > 0:
              ts = pd.to_datetime(pd.read_csv(path, usecols=['timestamp']).timestamp, utc=True, errors='coerce').dropna()
              if not ts.empty:
                  first, latest = ts.min(), ts.max()
                  use_cache = first <= start and latest >= now - pd.Timedelta(days=2)

          print(f'use_cache={str(use_cache).lower()}')
          print(f'start={start.isoformat()}')
          print(f'end={now.isoformat()}')
          print(f'cache_first={first.isoformat() if first is not None else ""}')
          print(f'cache_latest={latest.isoformat() if latest is not None else ""}')
          PY

          echo "Persistent research cache usable: ${{ steps.source.outputs.use_cache }}"

      - name: Slice persistent latest-first Dukascopy research base
        if: steps.source.outputs.use_cache == 'true'
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          src = Path('data/xauusd_m5_dukascopy_research.csv')
          out = Path('tmp/current_structural_m5.csv')
          out.parent.mkdir(parents=True, exist_ok=True)
          x = pd.read_csv(src)
          ts = pd.to_datetime(x.timestamp, utc=True, errors='raise')
          start = pd.Timestamp('${{ steps.source.outputs.start }}')
          end = pd.Timestamp('${{ steps.source.outputs.end }}')
          keep = (ts >= start) & (ts <= end)
          x.loc[keep].to_csv(out, index=False)
          print(f'Used persistent Dukascopy research base: {int(keep.sum()):,} bars')
          PY

      - name: Fetch current Dukascopy XAUUSD M5 BID when cache is not ready
        if: steps.source.outputs.use_cache != 'true'
        run: |
          node scripts/fetch_dukascopy.mjs \
            --from '${{ steps.source.outputs.start }}' \
            --to '${{ steps.source.outputs.end }}' \
            --output tmp/current_dukascopy_xauusd_m5.csv \
            --price-type bid

      - name: Normalize downloaded current dataset
        if: steps.source.outputs.use_cache != 'true'
        run: |
          python -m casio.sync_market_data \
            --file tmp/current_dukascopy_xauusd_m5.csv \
            --output tmp/current_structural_m5.csv

      - name: Validate current research dataset
        run: |
          python - <<'PY'
          import pandas as pd
          x = pd.read_csv('tmp/current_structural_m5.csv')
          ts = pd.to_datetime(x.timestamp, utc=True)
          print(f'Current structural dataset: {len(x):,} bars, {ts.min()} -> {ts.max()}')
          if (ts.max() - ts.min()).total_seconds() < 190 * 86400:
              raise SystemExit('Current Dukascopy window is too short for 30d warm-up + three 60d slices')
          PY

      - name: Run latest-first structural portfolio research
        run: |
          python -m casio.structural_current_research \
            --data tmp/current_structural_m5.csv \
            --output reports/structural-current

      - name: Publish decision-relevant summary
        run: |
          cat reports/structural-current/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          x = json.loads(Path('reports/structural-current/summary.json').read_text())
          print('\n## Portfolio target')
          print('8 trades/30d · WR >=42% · avg winner ~3.5R · avg loss ~1R · expectancy >=+0.70R · PF >=2')
          print('\nData source: persistent latest-first Dukascopy research CSV when current/complete enough; provider download is fallback only.')
          print('Selected candidate is research-only; no production auto-deploy.')
          PY

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: casio-structural-current
          path: reports/structural-current/
          retention-days: 60
