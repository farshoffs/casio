name: CASIO v4 2026 RM100 Dukascopy Backtest

on:
  push:
    branches:
      - feature/v4-confluence-signals
    paths:
      - .github/workflows/v4-2026-rm100-backtest.yml
      - casio/v4_2026_rm100_backtest.py
      - casio/v4_confluence_research.py
      - casio/v4_edge_diagnose.py
      - data/xauusd_m5_dukascopy_research.csv
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v4-2026-rm100-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v4-confluence-signals
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy

      - name: Run 2026 Dukascopy RM100 backtest
        run: python -m casio.v4_2026_rm100_backtest

      - name: Commit Markdown report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/v4-confluence/BACKTEST_2026_RM100_DUKASCOPY.md
          if git diff --cached --quiet; then
            echo "Report unchanged; nothing to commit."
          else
            git commit -m "report: add 2026 RM100 Dukascopy backtest"
            git push origin HEAD:feature/v4-confluence-signals
          fi
