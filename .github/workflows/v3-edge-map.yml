name: CASIO v3 High-Asymmetry Edge Map

on:
  push:
    branches: [main]
    paths:
      - 'casio/v3_edge_map.py'
      - 'casio/v3_asymmetry_challenger.py'
      - 'casio/v3_m5_engine.py'
      - 'casio/v3_core.py'
      - 'data/xauusd_m5.csv'
      - 'requirements.txt'
      - '.github/workflows/v3-edge-map.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-map:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate
        run: |
          python -m compileall -q casio
          python - <<'PY'
          from casio.v3_edge_map import candidate_frame, evaluate_candidates, run
          print('CASIO edge-map research imports successfully')
          PY
      - name: Run edge map
        run: python -m casio.v3_edge_map --data data/xauusd_m5.csv --output reports/v3-edge-map
      - name: Publish summary
        run: cat reports/v3-edge-map/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: casio-v3-edge-map
          path: reports/v3-edge-map/
          retention-days: 30
