name: CASIO v4 Setup-First Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'casio/v4_core.py'
      - 'casio/v4_strategy.py'
      - 'casio/v4_compare.py'
      - 'casio/v3_core.py'
      - 'casio/v3_strategy.py'
      - 'casio/v3_backtest.py'
      - 'data/xauusd_m5.csv'
      - 'requirements.txt'
      - '.github/workflows/v4-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate v4 modules
        run: |
          python -m compileall -q casio
          python - <<'PY'
          from casio.v4_core import V4Config
          from casio.v4_strategy import signals_for_config
          from casio.v4_compare import compare
          print('CASIO v4 setup-first modules import successfully')
          PY

      - name: Check diagnostic data
        id: data
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import pandas as pd
          path = Path('data/xauusd_m5.csv')
          if not path.exists() or path.stat().st_size == 0:
              print('available=false')
              raise SystemExit
          n = max(sum(1 for _ in path.open(encoding='utf-8')) - 1, 0)
          print(f'available={str(n >= 500).lower()}')
          print(f'rows={n}')
          PY

      - name: Run provisional v3 vs v4 comparison
        if: steps.data.outputs.available == 'true'
        run: python -m casio.v4_compare --data data/xauusd_m5.csv --output reports/v4-diagnostic

      - name: Publish provisional diagnostic
        if: steps.data.outputs.available == 'true'
        shell: bash
        run: |
          echo '## Experimental v4 — provisional only' >> "$GITHUB_STEP_SUMMARY"
          echo 'This comparison can run during backfill to expose obvious frequency/logic problems, but it is not robust validation.' >> "$GITHUB_STEP_SUMMARY"
          cat reports/v4-diagnostic/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic artifact
        if: steps.data.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: casio-v4-diagnostic
          path: reports/v4-diagnostic/
          retention-days: 30
