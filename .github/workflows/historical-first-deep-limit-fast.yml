name: Historical First Deep Limit Fast

on:
  push:
    branches:
      - research/historical-2017-2020
    paths:
      - 'casio/historical_first_deep_limit_fast.py'
      - '.github/workflows/historical-first-deep-limit-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run fast deep-limit shortlist
        run: |
          python -m casio.historical_first_deep_limit_fast \
            --data data/xauusd_m5_secondary_octafx_mt4.csv \
            --output reports/historical-first-deep-limit-fast
      - name: Publish summary
        run: cat reports/historical-first-deep-limit-fast/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: historical-first-deep-limit-fast
          path: reports/historical-first-deep-limit-fast/
          retention-days: 30
