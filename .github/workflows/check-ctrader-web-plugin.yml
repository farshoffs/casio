name: Check cTrader web plugin

on:
  push:
    branches:
      - feature/regime-router-dashboard-research
    paths:
      - ctrader-web-plugin/regime-router-dashboard/index.html
      - .github/workflows/check-ctrader-web-plugin.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract module JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("ctrader-web-plugin/regime-router-dashboard/index.html")
          s = p.read_text(encoding="utf-8")
          m = re.search(r'<script type="module">(.*?)</script>', s, re.S)
          if not m:
              raise SystemExit("module script not found")
          js = m.group(1)
          Path("/tmp/casio-dashboard.mjs").write_text(js, encoding="utf-8")
          required = [
              "RR10-XD1",
              "rr10-live-state/rr10-state.json",
              "casio.regime-router.rr10.state.v1",
              "getLightSymbolList",
              "getSymbol",
              "subscribeQuotes",
              "quoteEvent",
              "State live",
          ]
          for token in required:
              if token not in js:
                  raise SystemExit(f"missing required cross-device token: {token}")
          forbidden = [
              "createNewOrder", "modifyOrder", "closePosition", "cancelOrder",
              "getServerData", "getTrendbarList", "getTrendbarListCompat",
              "oldRouterSelected0591", "fetchM15History", "resampleBars"
          ]
          for token in forbidden:
              if token in js:
                  raise SystemExit(f"read-only guard failed: {token} present")
          print("dashboard source guardrails passed")
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/casio-dashboard.mjs
