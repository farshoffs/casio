name: Historical First Outcome ML

on:
  push:
    branches:
      - research/historical-2017-2020
    paths:
      - 'casio/historical_first_outcome_ml.py'
      - '.github/workflows/historical-first-outcome-ml.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install scikit-learn
      - name: Run outcome-first walk-forward selector
        run: |
          python -m casio.historical_first_outcome_ml \
            --data data/xauusd_m5_secondary_octafx_mt4.csv \
            --output reports/historical-first-outcome-ml
      - name: Publish summary
        run: cat reports/historical-first-outcome-ml/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: historical-first-outcome-ml
          path: reports/historical-first-outcome-ml/
          retention-days: 30
