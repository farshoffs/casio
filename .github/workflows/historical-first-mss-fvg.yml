name: Historical First MSS FVG Search

on:
  push:
    branches:
      - research/historical-2017-2020
    paths:
      - 'casio/historical_first_mss_fvg.py'
      - '.github/workflows/historical-first-mss-fvg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run sweep MSS FVG search
        run: |
          python -m casio.historical_first_mss_fvg \
            --data data/xauusd_m5_secondary_octafx_mt4.csv \
            --output reports/historical-first-mss-fvg
      - name: Publish summary
        run: cat reports/historical-first-mss-fvg/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: historical-first-mss-fvg
          path: reports/historical-first-mss-fvg/
          retention-days: 30
