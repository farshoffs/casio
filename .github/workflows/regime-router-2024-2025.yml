name: CASIO Frozen Regime Router 2024-2025

on:
  push:
    branches:
      - feature/multi-technique-2026
    paths:
      - 'casio/regime_router_2024_2025.py'
      - '.github/workflows/regime-router-2024-2025.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/multi-technique-2026
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy tabulate

      - name: Run frozen Regime Router on 2024 and 2025
        run: python -m casio.regime_router_2024_2025

      - name: Commit report and audit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/regime-router-2024-2025
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "research: frozen regime router 2024-2025 results"
            git push origin HEAD:feature/multi-technique-2026
          fi
