name: CASIO v5 Pine Format Fix

on:
  push:
    branches:
      - feature/v4-confluence-signals
    paths:
      - '.github/workflows/v5-fix-format.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4-confluence-signals
      - name: Fix top-level Pine indentation
        run: sed -i 's/^ groupRisk =/groupRisk =/' pine/CASIO_XAUUSD_v5_MTF.pine
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pine/CASIO_XAUUSD_v5_MTF.pine
          if ! git diff --cached --quiet; then
            git commit -m 'fix: clean v5 Pine top-level indentation'
            git push origin HEAD:feature/v4-confluence-signals
          fi
