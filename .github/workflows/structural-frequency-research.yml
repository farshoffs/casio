name: CASIO Structural Frequency Research

on:
  push:
    branches: [main]
    paths:
      - 'casio/structural_frequency_research.py'
      - 'casio/structural_portfolio_latest.py'
      - 'casio/structural_swing.py'
      - 'casio/v3_core.py'
      - 'casio/v3_m5_engine.py'
      - 'scripts/fetch_dukascopy.mjs'
      - '.github/workflows/structural-frequency-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: casio-structural-frequency-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install --no-save dukascopy-node@1.50.0

      - name: Validate research module
        run: |
          python -m compileall -q casio
          python - <<'PY'
          from casio.structural_frequency_research import MODES
          print('Curated structural modes:', MODES)
          PY

      - name: Determine 210-day current-first window
        id: window
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pandas as pd
          now = pd.Timestamp.now(tz='UTC').floor('5min')
          start = now - pd.Timedelta(days=210)
          print(f'start={start.isoformat()}')
          print(f'end={now.isoformat()}')
          PY

      - name: Fetch current Dukascopy XAUUSD M5 BID
        run: |
          node scripts/fetch_dukascopy.mjs \
            --from '${{ steps.window.outputs.start }}' \
            --to '${{ steps.window.outputs.end }}' \
            --output tmp/current_dukascopy_xauusd_m5.csv \
            --price-type bid

      - name: Normalize current dataset
        run: |
          python -m casio.sync_market_data \
            --file tmp/current_dukascopy_xauusd_m5.csv \
            --output tmp/current_structural_m5.csv

      - name: Run frequency expansion research
        run: |
          python -m casio.structural_frequency_research \
            --data tmp/current_structural_m5.csv \
            --output reports/structural-frequency

      - name: Publish report
        run: cat reports/structural-frequency/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: casio-structural-frequency
          path: reports/structural-frequency/
          retention-days: 60
