name: CASIO v4 FxPro Calibration

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v4-confluence-signals
    paths:
      - '.github/workflows/v4-fxpro-calibration.yml'
      - 'scripts/patch_v4_fxpro.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4-confluence-signals
      - name: Apply FxPro calibration
        run: python scripts/patch_v4_fxpro.py
      - name: Commit calibrated Pine
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pine/CASIO_XAUUSD_v4_CONFLUENCE.pine
          git commit -m 'fix: calibrate v4 for FxPro and remove lookahead bias'
          git push origin HEAD:feature/v4-confluence-signals
