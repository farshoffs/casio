name: CASIO RR10 TradingView / cBot Parity

on:
  push:
    branches: [feature/regime-router-dashboard-research]
    paths:
      - 'pine/CASIO_REGIME_ROUTER_RR10.pine'
      - 'tradingview/casio_regime_router_dashboard_v1.pine'
      - 'ctrader/CasioRegimeRouterSignal.cs'
      - 'casio/regime_router_engine.py'
      - 'casio/rr10_integrity_backtest.py'
      - '.github/workflows/rr10-surface-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/regime-router-dashboard-research

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python syntax
        run: |
          python -m py_compile casio/regime_router_engine.py casio/rr10_integrity_backtest.py

      - name: Assert RR10 parity
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          engine = read('casio/regime_router_engine.py')
          pine = read('pine/CASIO_REGIME_ROUTER_RR10.pine')
          tv = read('tradingview/casio_regime_router_dashboard_v1.pine')
          cbot = read('ctrader/CasioRegimeRouterSignal.cs')
          integrity = read('casio/rr10_integrity_backtest.py')

          checks = {
              'TradingView mirrors identical': pine == tv,
              'Python engine RR10': 'ENGINE_ID = "RR10"' in engine,
              'Python default 3R': 'target_r: float = 3.0' in engine,
              'Python support=2': 'support_bars: int = 2' in engine,

              'Pine 3R': 'const float TARGET_R = 3.0' in pine,
              'Pine support=2': 'const int SUPPORT_BARS = 2' in pine,
              'Pine ADX=18': 'const float TREND_ADX = 18.0' in pine,
              'Pine risk=5%': 'const float RISK_FRACTION = 0.05' in pine,
              'Pine canonical 0591 gate': (
                  'oldRouterSelected0591' in pine
                  and 'spDir == 0 and m0591Dir != 0 and supportDir >= 2' in pine
                  and 'oldRouterSelected0591 and not primary and alignCount >= 1 ? m0591Dir : 0' in pine
              ),
              'Pine confirmed M15 close entry': 'activeEntry := close' in pine,
              'Pine one active lifecycle': 'activeDir == 0 and canonicalDir != 0' in pine,

              'cBot 3R': 'private const double CanonicalTargetR = 3.0;' in cbot,
              'cBot support=2': 'private const int SupportBars = 2;' in cbot,
              'cBot ADX=18': 'private const double TrendAdxThreshold = 18.0;' in cbot,
              'cBot risk=5%': 'private const double RiskPercent = 5.0;' in cbot,
              'cBot canonical 0591 gate': (
                  'oldRouterSelected0591' in cbot
                  and 'spDir == 0 && m0591Dir != 0 && supportDir >= 2' in cbot
                  and 'oldRouterSelected0591 && !primary && alignCount >= 1 ? m0591Dir : 0' in cbot
              ),
              'cBot confirmed M15 close entry': 'var entry = bar.Close;' in cbot,
              'cBot one active lifecycle': 'if (_virtualActive)' in cbot,
              'cBot stop-first collision': 'var result = stopHit ? "STOP" : "TARGET"' in cbot,
              'cBot canonical live technique': 'RR10 Canonical / 0591' in cbot,
              'cBot email transport': 'Notifications.SendEmail' in cbot and 'TrySendEmail' in cbot,
              'cBot router mode defined': 'var routerMode = strongTrend ? "TREND" : "MIXED";' in cbot,

              'no V1 live selection in cBot': 'Select(wanted, "V1 Legacy M15"' not in cbot and 'Select(v1Dir, "V1 Legacy M15"' not in cbot,
              'no Outcome live selection in cBot': 'Select(wanted, "Outcome First M15"' not in cbot and 'Select(outDir, "Outcome First M15"' not in cbot,
              'no Structural live selection in cBot': 'Select(spDir, "Structural Portfolio MTF"' not in cbot and 'Select(sfDir, "Structural Frequency M15"' not in cbot,

              'integrity supports RR2-5': 'DEFAULT_RRS = (2.0, 3.0, 4.0, 5.0)' in integrity,
              'integrity risk configurable': '--risk-pct' in integrity,
          }

          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('RR10 parity failure: ' + ', '.join(failed))
          print('RR10 parity guard passed: TradingView and cBot use the same canonical live selection gate.')
          PY
