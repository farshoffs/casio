name: CASIO RR10 Surface Parity

on:
  push:
    branches: [feature/regime-router-dashboard-research]
    paths:
      - 'casio/regime_router_engine.py'
      - 'casio/live_signal.py'
      - 'casio/rr10_integrity_backtest.py'
      - 'pine/CASIO_REGIME_ROUTER_RR10.pine'
      - 'tradingview/casio_regime_router_dashboard_v1.pine'
      - 'ctrader/CasioRegimeRouterSignal.cs'
      - 'ctrader-web-plugin/regime-router-dashboard/index.html'
      - 'ctrader-web-plugin/cross-device/index.html'
      - 'casio/rr10_dashboard_state.py'
      - 'apps-script/Code.gs'
      - 'integrations/apps-script-regime-signal/Code.gs'
      - 'integrations/vercel-regime-signal/api/signal.js'
      - '.github/workflows/rr10-fxpro-integrity.yml'
      - '.github/workflows/rr10-surface-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/regime-router-dashboard-research

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python syntax
        run: |
          python -m py_compile \
            casio/regime_router_engine.py \
            casio/live_signal.py \
            casio/rr10_integrity_backtest.py

      - name: Relay JavaScript syntax
        run: |
          node --check integrations/vercel-regime-signal/api/signal.js
          cp integrations/apps-script-regime-signal/Code.gs /tmp/Code.js
          node --check /tmp/Code.js

      - name: Assert one canonical RR10 ruleset
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          engine = read('casio/regime_router_engine.py')
          pine = read('pine/CASIO_REGIME_ROUTER_RR10.pine')
          legacy_pine = read('tradingview/casio_regime_router_dashboard_v1.pine')
          ctrader = read('ctrader-web-plugin/regime-router-dashboard/index.html')
          ctrader_cross = read('ctrader-web-plugin/cross-device/index.html')
          cbot = read('ctrader/CasioRegimeRouterSignal.cs')
          gas = read('apps-script/Code.gs')
          gas_alias = read('integrations/apps-script-regime-signal/Code.gs')
          vercel = read('integrations/vercel-regime-signal/api/signal.js')
          integrity = read('casio/rr10_integrity_backtest.py')

          checks = {
              'python research engine id': 'ENGINE_ID = "RR10"' in engine,
              'python research fixed 3R default': 'target_r: float = 3.0' in engine,
              'python research support 2': 'support_bars: int = 2' in engine,
              'two TradingView paths identical': pine == legacy_pine,
              'Pine fixed 3R': 'const float TARGET_R = 3.0' in pine,
              'Pine fixed 5% risk': 'const float RISK_FRACTION = 0.05' in pine,
              'Pine 0.005% commission': 'commission_value=0.005' in pine,
              'Pine MYR conversion': 'strategy.convert_to_symbol' in pine,
              'Pine canonical gate': 'oldRouterSelected0591' in pine and 'canonicalDir' in pine,
              'Pine full state heartbeat': 'casio.regime-router.rr10.state.v1' in pine and 'if barstate.isconfirmed and isM15' in pine,
              'Pine is live owner': 'tradingview-fxpro-rr10' in pine and 'syminfo.tickerid' in pine,
              'one cTrader cross-device UI': ctrader == ctrader_cross,
              'cTrader dashboard RR10': 'RR10-XD2' in ctrader and 'casio.regime-router.rr10.state.v1' in ctrader,
              'cTrader state URL injected': '__CASIO_RR10_STATE_URL__' in ctrader,
              'cTrader no Dukascopy/GitHub live state': 'rr10-live-state' not in ctrader and 'raw.githubusercontent.com' not in ctrader,
              'cTrader no duplicated router': 'oldRouterSelected0591' not in ctrader and 'canonicalDir' not in ctrader,
              'cTrader no historical RPC': 'getTrendbarList' not in ctrader and 'getServerData' not in ctrader,
              'cTrader quote overlay only': 'subscribeQuotes' in ctrader and 'quoteEvent' in ctrader,
              'cBot retired': 'retired as a live signal engine' in cbot and 'Stop();' in cbot,
              'Apps Script aliases identical': gas == gas_alias,
              'Apps Script stores RR10 state': "RR10_STATE_SCHEMA = 'casio.regime-router.rr10.state.v1'" in gas and 'handleRr10State_' in gas and 'rr10StateResponse_' in gas,
              'Apps Script emails only signal transition': "String(p.transition || '') === 'signal'" in gas,
              'Vercel live relay retired': 'retired: true' in vercel and 'status(410)' in vercel,
              'integrity RR 2-5': 'DEFAULT_RRS = (2.0, 3.0, 4.0, 5.0)' in integrity,
              'integrity RM100': 'START_EQUITY_RM = 100.0' in integrity,
              'integrity 5%': 'RISK_FRACTION = 0.05' in integrity,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('RR10 parity failure: ' + ', '.join(failed))
          print('RR10 parity guard passed: all live surfaces are canonical.')
          PY
