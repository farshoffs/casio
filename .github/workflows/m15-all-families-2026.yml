name: CASIO Native M15 All Families 2026

on:
  push:
    branches:
      - feature/m15-all-strategies-2026
    paths:
      - casio/m15_all_families_2026.py
      - .github/workflows/m15-all-families-2026.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout M15 benchmark branch
        uses: actions/checkout@v4
        with:
          ref: feature/m15-all-strategies-2026
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install tabulate

      - name: Run native M15 all-family 2026 benchmark
        run: python -m casio.m15_all_families_2026

      - name: Commit report and audit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/m15-all-families-2026
          if git diff --cached --quiet; then
            echo "No report changes to commit"
            exit 0
          fi
          git commit -m "research: native M15 all-family 2026 report"
          git pull --rebase origin feature/m15-all-strategies-2026
          git push origin HEAD:feature/m15-all-strategies-2026
