name: Historical First Strict M5 Search

on:
  push:
    branches:
      - research/historical-2017-2020
    paths:
      - 'casio/historical_first_strict_m5.py'
      - '.github/workflows/historical-first-strict-m5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run strict M5 precision search
        run: |
          python -m casio.historical_first_strict_m5 \
            --data data/xauusd_m5_secondary_octafx_mt4.csv \
            --output reports/historical-first-strict-m5
      - name: Publish summary
        run: cat reports/historical-first-strict-m5/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: historical-first-strict-m5
          path: reports/historical-first-strict-m5/
          retention-days: 30
