name: CASIO v3 Research & Robustness

on:
  push:
    branches: [main]
    paths:
      - 'casio/v3_core.py'
      - 'casio/v3_strategy.py'
      - 'casio/v3_backtest.py'
      - 'casio/v3_research.py'
      - 'casio/research_cli.py'
      - 'casio/sync_market_data.py'
      - 'api/tradingview.py'
      - 'data/xauusd_m5.csv'
      - 'requirements.txt'
      - '.github/workflows/v3-research.yml'
  workflow_dispatch:
    inputs:
      max_candidates:
        description: 'Maximum candidate configurations to evaluate'
        required: false
        default: '64'
      cost_bps:
        description: 'Round-trip cost assumption in basis points'
        required: false
        default: '1.0'
  # Data commits normally start research. Keep a weekly safety rerun too.
  schedule:
    - cron: '43 21 * * 0'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate v3 research and API modules
        run: |
          python -m compileall -q casio api
          python - <<'PY'
          from api.tradingview import handler
          from casio.sync_market_data import sync_file, sync_url
          from casio.v3_core import V3Config, prepare_features
          from casio.v3_strategy import signals_for_config
          from casio.v3_backtest import backtest_signals, metrics
          from casio.v3_research import monte_carlo_bootstrap, run_research, session_stability
          print('CASIO v3 session-aware research, market sync and API modules import successfully')
          PY

      - name: Check research-data maturity
        id: data
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import pandas as pd

          path = Path('data/xauusd_m5.csv')
          if not path.exists() or path.stat().st_size == 0:
              print('available=false')
              print('reason=missing')
              raise SystemExit

          ts = pd.to_datetime(pd.read_csv(path, usecols=['timestamp'])['timestamp'], utc=True, errors='coerce').dropna()
          if ts.empty:
              print('available=false')
              print('reason=invalid')
              raise SystemExit

          first, latest = ts.min(), ts.max()
          now = pd.Timestamp.now(tz='UTC')
          span_days = (latest - first).total_seconds() / 86400
          age_days = (now - latest).total_seconds() / 86400

          # Avoid producing seductive "optimization results" from an early partial
          # backfill. Full research starts only after at least two years of history
          # are present AND the dataset has caught up to the current market.
          ready = span_days >= 730 and age_days <= 7
          print(f'available={str(ready).lower()}')
          print(f'reason={"ready" if ready else "backfill_in_progress"}')
          print(f'first={first.isoformat()}')
          print(f'latest={latest.isoformat()}')
          print(f'span_days={span_days:.1f}')
          print(f'age_days={age_days:.1f}')
          PY

      - name: Explain research hold
        if: steps.data.outputs.available != 'true'
        shell: bash
        run: |
          echo '## CASIO v3 research held' >> "$GITHUB_STEP_SUMMARY"
          echo 'Research/API code validation passed, but full strategy optimization is intentionally held until the historical dataset is mature.' >> "$GITHUB_STEP_SUMMARY"
          echo "Reason: ${{ steps.data.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.data.outputs.first }}" ]; then
            echo "Coverage: ${{ steps.data.outputs.first }} -> ${{ steps.data.outputs.latest }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Span: ${{ steps.data.outputs.span_days }} days; latest bar age: ${{ steps.data.outputs.age_days }} days." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Gate: >=730 days of history and latest data <=7 days old.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This prevents CASIO from treating a partial backfill as robust evidence.' >> "$GITHUB_STEP_SUMMARY"

      - name: Run v3 research
        if: steps.data.outputs.available == 'true'
        env:
          MAX_CANDIDATES: ${{ github.event.inputs.max_candidates || '64' }}
          COST_BPS: ${{ github.event.inputs.cost_bps || '1.0' }}
        run: |
          python -m casio.research_cli \
            --data data/xauusd_m5.csv \
            --output reports/v3-research \
            --max-candidates "$MAX_CANDIDATES" \
            --cost-bps "$COST_BPS"

      - name: Publish research summary
        if: steps.data.outputs.available == 'true'
        shell: bash
        run: |
          cat reports/v3-research/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload research artifacts
        if: steps.data.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: casio-v3-research
          path: reports/v3-research/
          retention-days: 60
