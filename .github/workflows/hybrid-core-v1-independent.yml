name: Hybrid Core v1 independent validation

on:
  push:
    branches:
      - research/casio-hybrid-core-v1-validation
    paths:
      - 'casio/hybrid_core_v1_independent.py'
      - '.github/workflows/hybrid-core-v1-independent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - run: python casio/hybrid_core_v1_independent.py
      - uses: actions/upload-artifact@v4
        with:
          name: casio-hybrid-core-v1-independent
          path: reports/casio-hybrid-core-v1-independent/
