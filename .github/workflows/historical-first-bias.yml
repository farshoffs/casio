name: Historical First Bias Gate

on:
  push:
    branches:
      - research/historical-2017-2020
    paths:
      - 'casio/historical_first_bias.py'
      - '.github/workflows/historical-first-bias.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bias-gate development
        run: |
          python -m casio.historical_first_bias \
            --data data/xauusd_m5_secondary_octafx_mt4.csv \
            --output reports/historical-first-bias
      - name: Publish summary
        run: cat reports/historical-first-bias/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: historical-first-bias
          path: reports/historical-first-bias/
          retention-days: 30
