name: Finotive Prop Research

on:
  push:
    branches:
      - research/finotive-prop
    paths:
      - 'casio/finotive_prop_research.py'
      - '.github/workflows/finotive-prop-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finotive-prop-research
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate module
        run: |
          python -m compileall -q casio
          python - <<'PY'
          from casio.finotive_prop_research import TARGET_R, RISKS
          print("RR", TARGET_R, "RISKS", RISKS)
          PY

      - name: Run prop backtest
        run: |
          python -m casio.finotive_prop_research             --data data/xauusd_m5.csv             --output reports/finotive-prop-2026

      - name: Publish report
        if: always()
        run: |
          if [ -f reports/finotive-prop-2026/REPORT.md ]; then
            cat reports/finotive-prop-2026/REPORT.md
            cat reports/finotive-prop-2026/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finotive-prop-2026
          path: reports/finotive-prop-2026/
          retention-days: 30
