name: Finotive Prop Research

on:
  push:
    branches:
      - research/finotive-prop
    paths:
      - 'casio/finotive_prop_research.py'
      - 'casio/finotive_prop_hunt2.py'
      - '.github/workflows/finotive-prop-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finotive-prop-research
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate modules
        run: python -m compileall -q casio

      - name: Run prop baseline
        run: |
          python -m casio.finotive_prop_research             --data data/xauusd_m5.csv             --output reports/finotive-prop-2026

      - name: Run prop hunt 2
        run: |
          python -m casio.finotive_prop_hunt2             --data data/xauusd_m5.csv             --output reports/finotive-prop-hunt2

      - name: Publish reports
        if: always()
        run: |
          for f in reports/finotive-prop-2026/REPORT.md reports/finotive-prop-hunt2/REPORT.md; do
            if [ -f "$f" ]; then
              cat "$f"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finotive-prop-research
          path: |
            reports/finotive-prop-2026/
            reports/finotive-prop-hunt2/
          retention-days: 30
