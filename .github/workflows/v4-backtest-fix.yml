name: CASIO v4 Backtest Fix

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v4-confluence-signals
    paths:
      - '.github/workflows/v4-backtest-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4-confluence-signals

      - name: Make TradingView broker emulator the source of truth
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('pine/CASIO_XAUUSD_v4_CONFLUENCE.pine')
          s = p.read_text(encoding='utf-8')

          old = 'strategy("CASIO XAUUSD v4 — Confluence Signal Engine", overlay=true, pyramiding=0, process_orders_on_close=true, calc_on_order_fills=true, initial_capital=10000, default_qty_type=strategy.percent_of_equity, default_qty_value=1, commission_type=strategy.commission.percent, commission_value=0.005, max_labels_count=500, max_lines_count=500, max_boxes_count=50, max_bars_back=10000)'
          new = 'strategy("CASIO XAUUSD v4 — Confluence Signal Engine", overlay=true, pyramiding=0, process_orders_on_close=true, calc_on_order_fills=true, calc_on_every_tick=false, initial_capital=10000, default_qty_type=strategy.fixed, default_qty_value=1, margin_long=1, margin_short=1, commission_type=strategy.commission.percent, commission_value=0.005, max_labels_count=500, max_lines_count=500, max_boxes_count=50, max_bars_back=10000)'
          assert old in s, 'strategy declaration anchor missing'
          s = s.replace(old, new, 1)

          anchor = 'winRateTarget = input.float(70.0, "Win-rate target %", minval=40, maxval=90, step=1, group=groupProfile)\n'
          addition = anchor + '''\n// TradingView strategy/backtest execution. Explicit quantity avoids broker-emulator\n// rejections on XAUUSD feeds whose minimum contract is larger than 1% equity sizing.\ngroupBacktest = "Backtest execution"\nbacktestQty = input.float(1.0, "Order size (contracts)", minval=0.01, step=0.01, group=groupBacktest, tooltip="TradingView strategy quantity. Match this to your broker/feed contract convention.")\nbacktestStart = input.time(timestamp("GMT+0", 2024, 1, 1, 0, 0), "Backtest start", group=groupBacktest)\nbacktestEnd = input.time(timestamp("GMT+0", 2030, 12, 31, 23, 59), "Backtest end", group=groupBacktest)\ninBacktestWindow = time >= backtestStart and time <= backtestEnd\n'''
          assert anchor in s, 'profile input anchor missing'
          s = s.replace(anchor, addition, 1)

          old = 'canConsider = chartIsM5 and barstate.isconfirmed and sessionAllowed and flat and cooldownReady and dayTrades < maxTradesPerDay'
          new = 'canConsider = chartIsM5 and barstate.isconfirmed and inBacktestWindow and sessionAllowed and flat and cooldownReady and dayTrades < maxTradesPerDay'
          assert old in s, 'canConsider anchor missing'
          s = s.replace(old, new, 1)

          old = 'var int activeScore = 0\nvar line[] historyLines = array.new_line()'
          new = 'var int activeScore = 0\nvar bool orderPending = false\nvar int pendingBar = na\nvar int seenClosedTrades = 0\nvar line[] historyLines = array.new_line()'
          assert old in s, 'state anchor missing'
          s = s.replace(old, new, 1)

          old = '    activeScore := longSignal ? longScore : shortScore\n    lastAcceptedBar := bar_index\n    dayTrades += 1\n    weekTrades += 1'
          new = '    activeScore := longSignal ? longScore : shortScore\n    orderPending := true\n    pendingBar := bar_index\n    lastAcceptedBar := bar_index'
          assert old in s, 'signal state anchor missing'
          s = s.replace(old, new, 1)

          s = s.replace('strategy.entry("CASIO-L", strategy.long)', 'strategy.entry("CASIO-L", strategy.long, qty=backtestQty)', 1)
          s = s.replace('strategy.entry("CASIO-S", strategy.short)', 'strategy.entry("CASIO-S", strategy.short, qty=backtestQty)', 1)

          anchor = '// Dynamic breakeven protection. Initial stop remains the SL shown at signal time.\n'
          addition = '''// Synchronize the visual plan with TradingView's actual broker-emulator fill.\n// This is the source of truth for both live chart state and Strategy Tester history.\njustOpened = strategy.position_size != 0 and strategy.position_size[1] == 0\nif justOpened\n    activeDirection := strategy.position_size > 0 ? 1 : -1\n    activeEntry := strategy.position_avg_price\n    activeRisk := math.abs(activeEntry - activeInitialStop)\n    activeStop := activeInitialStop\n    activeTarget := activeDirection == 1 ? activeEntry + targetR * activeRisk : activeEntry - targetR * activeRisk\n    if orderPending\n        dayTrades += 1\n        weekTrades += 1\n    orderPending := false\n    pendingBar := na\n\n// Dynamic breakeven protection. Initial stop remains the SL shown at signal time.\n'''
          assert anchor in s, 'breakeven anchor missing'
          s = s.replace(anchor, addition, 1)

          old = '''justClosed = strategy.position_size == 0 and strategy.position_size[1] != 0\nif justClosed\n    activeDirection := 0\n    activeEntry := na\n    activeInitialStop := na\n    activeStop := na\n    activeTarget := na\n    activeRisk := na\n    activePlaybook := "WAIT"\n    activeScore := 0\n'''
          new = '''newClosedTrade = strategy.closedtrades > seenClosedTrades\nif newClosedTrade\n    seenClosedTrades := strategy.closedtrades\n    activeDirection := 0\n    activeEntry := na\n    activeInitialStop := na\n    activeStop := na\n    activeTarget := na\n    activeRisk := na\n    activePlaybook := "WAIT"\n    activeScore := 0\n    orderPending := false\n    pendingBar := na\n\n// If a TradingView order is rejected or cannot fill, do not leave a fake ACTIVE trade.\nif strategy.position_size == 0 and orderPending and not na(pendingBar) and bar_index > pendingBar\n    activeDirection := 0\n    activeEntry := na\n    activeInitialStop := na\n    activeStop := na\n    activeTarget := na\n    activeRisk := na\n    activePlaybook := "WAIT"\n    activeScore := 0\n    orderPending := false\n    pendingBar := na\n'''
          assert old in s, 'close-state anchor missing'
          s = s.replace(old, new, 1)

          s = s.replace('showActiveLevels and activeDirection != 0 ? activeEntry : na', 'showActiveLevels and (strategy.position_size != 0 or orderPending) ? activeEntry : na', 1)
          s = s.replace('showActiveLevels and activeDirection != 0 ? activeStop : na', 'showActiveLevels and (strategy.position_size != 0 or orderPending) ? activeStop : na', 1)
          s = s.replace('showActiveLevels and activeDirection != 0 ? activeTarget : na', 'showActiveLevels and (strategy.position_size != 0 or orderPending) ? activeTarget : na', 1)

          old = '''closedTrades = strategy.closedtrades\nwinRate = closedTrades > 0 ? strategy.wintrades * 100.0 / closedTrades : na\nprofitFactor = math.abs(strategy.grossloss) > 0 ? strategy.grossprofit / math.abs(strategy.grossloss) : na\nstatus = activeDirection == 1 ? "LONG ACTIVE" : activeDirection == -1 ? "SHORT ACTIVE" : longSetup and longScore >= requiredScore ? "LONG READY" : shortSetup and shortScore >= requiredScore ? "SHORT READY" : "WAIT"\nstatusColor = activeDirection == 1 ? color.new(color.green, 65) : activeDirection == -1 ? color.new(color.red, 65) : color.new(color.gray, 82)\n'''
          new = '''closedTrades = strategy.closedtrades\nwinRate = closedTrades > 0 ? strategy.wintrades * 100.0 / closedTrades : na\nprofitFactor = math.abs(strategy.grossloss) > 0 ? strategy.grossprofit / math.abs(strategy.grossloss) : na\nstrategyDirection = strategy.position_size > 0 ? 1 : strategy.position_size < 0 ? -1 : 0\nstatus = strategyDirection == 1 ? "LONG ACTIVE" : strategyDirection == -1 ? "SHORT ACTIVE" : orderPending ? "ORDER PENDING" : longSetup and longScore >= requiredScore ? "LONG READY" : shortSetup and shortScore >= requiredScore ? "SHORT READY" : "WAIT"\nstatusColor = strategyDirection == 1 ? color.new(color.green, 65) : strategyDirection == -1 ? color.new(color.red, 65) : orderPending ? color.new(color.orange, 70) : color.new(color.gray, 82)\n'''
          assert old in s, 'dashboard status anchor missing'
          s = s.replace(old, new, 1)

          s = s.replace('var table dash = table.new(position.top_right, 2, 14,', 'var table dash = table.new(position.top_right, 2, 16,', 1)
          s = s.replace('activeDirection != 0 ? activePlaybook : longScore >= shortScore ? longPlaybook : shortPlaybook', '(strategyDirection != 0 or orderPending) ? activePlaybook : longScore >= shortScore ? longPlaybook : shortPlaybook', 1)

          old = '''    table.cell(dash, 0, 13, "PROFILE", text_color=color.silver)\n    table.cell(dash, 1, 13, profile + (chartIsM5 ? " • M5" : " • USE M5"), text_color=chartIsM5 ? color.white : color.red)\nelse if barstate.islast\n    table.clear(dash, 0, 0, 1, 13)'''
          new = '''    table.cell(dash, 0, 13, "PROFILE", text_color=color.silver)\n    table.cell(dash, 1, 13, profile + (chartIsM5 ? " • M5" : " • USE M5"), text_color=chartIsM5 ? color.white : color.red)\n    table.cell(dash, 0, 14, "NET PROFIT", text_color=color.silver)\n    table.cell(dash, 1, 14, str.tostring(strategy.netprofit, "#.##"), text_color=strategy.netprofit >= 0 ? color.lime : color.red)\n    table.cell(dash, 0, 15, "MAX DRAWDOWN", text_color=color.silver)\n    table.cell(dash, 1, 15, str.tostring(strategy.max_drawdown, "#.##"), text_color=color.white)\nelse if barstate.islast\n    table.clear(dash, 0, 0, 1, 15)'''
          assert old in s, 'dashboard footer anchor missing'
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pine/CASIO_XAUUSD_v4_CONFLUENCE.pine
          git commit -m 'fix: execute v4 as real TradingView backtest strategy'
          git push origin HEAD:feature/v4-confluence-signals
